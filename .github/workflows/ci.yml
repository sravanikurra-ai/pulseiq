name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulseiq_user
          POSTGRES_PASSWORD: pulseiq_pass
          POSTGRES_DB: pulseiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseiq_user -d pulseiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations against the CI test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pulseiq_user:pulseiq_pass@localhost:5432/pulseiq_test
          TEST_DATABASE_URL: postgresql://pulseiq_user:pulseiq_pass@localhost:5432/pulseiq_test
          JWT_SECRET_KEY: ci-test-secret-not-used-in-production
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pulseiq_user:pulseiq_pass@localhost:5432/pulseiq_test
          TEST_DATABASE_URL: postgresql://pulseiq_user:pulseiq_pass@localhost:5432/pulseiq_test
          JWT_SECRET_KEY: ci-test-secret-not-used-in-production
        run: pytest --cov=app --cov-report=term-missing

  build-docker-images:
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t pulseiq-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t pulseiq-frontend:ci ./frontend