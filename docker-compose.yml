services:
  postgres:
    image: postgres:16
    container_name: pulseiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseiq_user
      POSTGRES_PASSWORD: pulseiq_pass
      POSTGRES_DB: pulseiq
    ports:
      - "5433:5432"
    volumes:
      - pulseiq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseiq_user -d pulseiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulseiq_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pulseiq_user:pulseiq_pass@postgres:5432/pulseiq
      TEST_DATABASE_URL: postgresql://pulseiq_user:pulseiq_pass@postgres:5432/pulseiq_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      APP_ENV: docker
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: pulseiq_frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  pulseiq_pg_data: